
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Atajo</title>
<style>
body{font-family:Arial;background:#0b132b;color:#fff;padding:30px}
input,button{padding:10px;font-size:16px;margin:5px}
.list{background:#fff;color:#000;position:absolute;z-index:5}
.item{padding:5px;cursor:pointer}
.item:hover{background:#eee}
</style>
</head>
<body>

<h1>Atajo ✈️</h1>
<div id="mode"></div>

<div>
<input id="from" placeholder="From"/>
<div id="fromList" class="list"></div>
</div>

<div>
<input id="to" placeholder="To"/>
<div id="toList" class="list"></div>
</div>

<button onclick="search()">Search</button>

<pre id="out"></pre>

<script>
async function init(){
 const h=await fetch("/health").then(r=>r.json());
 document.getElementById("mode").innerText =
   `Mode: ${h.mode} | Provider: ${h.provider}`;
 restore();
 wire("from","fromList");
 wire("to","toList");
}

function restore(){
 const s=JSON.parse(localStorage.getItem("atajo")||"{}");
 if(s.from)from.value=s.from;
 if(s.to)to.value=s.to;
}

function save(){
 localStorage.setItem("atajo",JSON.stringify({
  from:from.value,to:to.value
 }));
}

function wire(id,listId){
 const i=document.getElementById(id);
 const l=document.getElementById(listId);

 i.oninput=async()=>{
  const q=i.value.trim();
  if(q.length<2){l.innerHTML="";return;}
  const r=await fetch("/api/places?q="+q);
  const d=await r.json();
  l.innerHTML="";
  d.forEach(a=>{
   const div=document.createElement("div");
   div.className="item";
   div.textContent=`${a.city} (${a.code})`;
   div.onclick=()=>{
    i.value=a.code;
    l.innerHTML="";
    save();
   };
   l.appendChild(div);
  });
 };
}

async function search(){
 save();
 const r=await fetch("/api/search",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   from:from.value,
   to:to.value
  })
 });
 const j=await r.json();
 out.textContent=JSON.stringify(j,null,2);
}

init();
</script>

</body>
</html>
