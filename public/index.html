<!DOCTYPE html>
<html>
<head>
<title>Atajo – Cheap Routes</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family: Arial;
  margin: 30px;
  background: #0f172a;
  color: #e5e7eb;
}

input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: 0;
}

.card {
  background: #020617;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
}

a {
  color: #38bdf8;
}
</style>
</head>

<body>

<h1>Atajo ✈️</h1>

<p id="mode">Loading…</p>

<div>

  <input
    id="from"
    list="fromList"
    oninput="lookup('from','fromList')"
    placeholder="From"
  >
  <datalist id="fromList"></datalist>

  <input
    id="to"
    list="toList"
    oninput="lookup('to','toList')"
    placeholder="To"
  >
  <datalist id="toList"></datalist>

  <button onclick="go()">Search</button>

</div>

<div id="out"></div>

<script>

/* ================= INIT ================= */

async function init() {
  const h = await fetch("/health").then(r => r.json());

  document.getElementById("mode").innerText =
    "Mode: " + h.mode +
    " | Provider: " + h.provider +
    " | Marker: " + h.marker;
}

init();

/* ================= AUTOCOMPLETE ================= */

async function lookup(inputId, listId) {

  const q = document.getElementById(inputId).value;

  if (q.length < 2) return;

  const r = await fetch("/api/places?q=" + encodeURIComponent(q));
  const j = await r.json();

  const dl = document.getElementById(listId);

  dl.innerHTML = "";

  j.forEach(p => {

    const o = document.createElement("option");

    o.value = p.code;

    o.label =
      p.city +
      " – " +
      p.name +
      " (" +
      p.code +
      ")";

    dl.appendChild(o);

  });
}

/* ================= SEARCH ================= */

async function go() {

  const from =
    document.getElementById("from").value.toUpperCase();

  const to =
    document.getElementById("to").value.toUpperCase();

  const r = await fetch("/api/search", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ from, to })
  });

  const j = await r.json();

  const out = document.getElementById("out");

  out.innerHTML = "";

  if (!j.results || !j.results.length) {
    out.innerHTML = "<p>No results</p>";
    return;
  }

  j.results.forEach(x => {

    const d = document.createElement("div");

    d.className = "card";

    d.innerHTML = `
      <b>£${x.price_gbp}</b><br>
      ${x.depart_date}<br>
      Airline: ${x.airline}<br>
      <a href="${x.link}" target="_blank">Book</a>
    `;

    out.appendChild(d);
  });
}

</script>

</body>
</html>
